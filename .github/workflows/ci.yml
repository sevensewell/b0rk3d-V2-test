name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: windows-latest
    name: CI
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Check CMake version
        run: cmake --version

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: amd64

      - name: Generate CMake project
        run: cmake -D CMAKE_BUILD_TYPE=Release -D CMAKE_POLICY_VERSION_MINIMUM=3.5 -S. -Bbuild -G Ninja

      - name: Build 64bit release DLL
        run: cmake --build ./build --config Release --target Terminus --

      - name: Check if DLL got built
        run: if (-Not (Test-Path -path "build/Terminus.dll")) {throw 1}

      - name: Rename DLL to Terminus-dev-{GITHUB_SHA}.dll
        run: |
          Remove-Item Terminus-dev-*.dll -ErrorAction SilentlyContinue
          ren Terminus.dll Terminus-dev-${{github.sha}}.dll
        working-directory: build/

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary
          path: build/Terminus-dev-*.dll
